name: Oracle A1 Capacity Retry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-a1-creation
  cancel-in-progress: false

jobs:
  create-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure OCI credentials
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          umask 077
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > oci_api_key.pem
          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" > id_rsa.pub

          cat > oci_config <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$GITHUB_WORKSPACE/oci_api_key.pem
          EOF

          cat > oci.env <<EOF
          OCI_CONFIG=$GITHUB_WORKSPACE/oci_config
          OCT_FREE_AD=AD-1
          DISPLAY_NAME=mohit
          OCI_COMPUTE_SHAPE=VM.Standard.A1.Flex
          SECOND_MICRO_INSTANCE=False
          REQUEST_WAIT_TIME_SECS=60
          SSH_AUTHORIZED_KEYS_FILE=$GITHUB_WORKSPACE/id_rsa.pub
          OCI_SUBNET_ID=$OCI_SUBNET_ID
          OCI_IMAGE_ID=
          OPERATING_SYSTEM="Canonical Ubuntu"
          OS_VERSION=22.04
          ASSIGN_PUBLIC_IP=true
          BOOT_VOLUME_SIZE=199
          NOTIFY_EMAIL=False
          EOF

      - name: Retry instance creation
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 10m python -u main.py
          STATUS=$?

          echo "----- Instance status -----"
          if [ -f INSTANCE_CREATED ]; then
            cat INSTANCE_CREATED
            echo "Instance creation confirmed."
            exit 0
          fi

          echo "No instance created during this run."
          if [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 130 ]; then
            echo "Retry window ended. Next scheduled run will try again."
            exit 0
          fi

          cat UNHANDLED_ERROR.log 2>/dev/null || true
          exit "$STATUS"
